####################################################################################
### Karpenter scaling demo — real Node.js app
###
### Uses the simple-nodejs-app image to show Karpenter provisioning nodes on
### demand. Each replica requests real CPU/memory and is pinned (via node
### affinity) to Karpenter-managed nodes, so every replica must land on capacity
### that Karpenter launches — not on the EKS managed node group.
###
### Try it out:
###   kubectl apply -f k8s-manifests/karpenter/default-nodepool.yaml
###   kubectl apply -f k8s-manifests/karpenter/nodejs-app-scale.yaml
###
###   # Watch Karpenter react to pending pods and bring up nodes:
###   kubectl logs -f -n kube-system -l app.kubernetes.io/name=karpenter
###   kubectl get nodes -l karpenter.sh/registered=true -w
###   kubectl get pods -n karpenter-demo -o wide -w
###
###   # Scale up to force new nodes, then back down to watch consolidation:
###   kubectl -n karpenter-demo scale deployment nodejs-app --replicas 15
###   kubectl -n karpenter-demo scale deployment nodejs-app --replicas 0
###
### To demo the other image instead, swap the image/containerPort/probe port
### to simple-nodejs-app-2:latest on 8081.
####################################################################################
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: karpenter-demo
  labels:
    app.kubernetes.io/name: nodejs-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nodejs-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodejs-app
    spec:
      # Only schedule onto Karpenter-provisioned nodes so scaling this
      # Deployment directly drives Karpenter node provisioning.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: Exists
      # Spread replicas across nodes so scaling up needs more than one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nodejs-app
      terminationGracePeriodSeconds: 0
      containers:
        - name: nodejs-app
          image: public.ecr.aws/n4o6g6h8/simple-nodejs-app-1:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Sized so a few replicas exceed the managed node group and force
          # Karpenter to add capacity. Tune to taste.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-app
  namespace: karpenter-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nodejs-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
