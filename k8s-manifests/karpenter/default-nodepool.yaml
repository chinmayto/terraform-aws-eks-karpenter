####################################################################################
### Karpenter default EC2NodeClass + NodePool
###
### Apply AFTER `terraform apply` has installed the Karpenter controller:
###   kubectl apply -f k8s-manifests/karpenter/default-nodepool.yaml
###
### The selector values below must match what Terraform tags/creates:
###   role                    -> var.cluster_name  (module.karpenter node IAM role)
###   karpenter.sh/discovery  -> var.cluster_name  (subnet + node SG tags)
### Both default to "CT-EKS-Cluster". Update them if you change cluster_name.
####################################################################################
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Match the EKS managed node group AMI family (AL2023)
  amiSelectorTerms:
    - alias: al2023@latest
  role: CT-EKS-Cluster
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: CT-EKS-Cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: CT-EKS-Cluster
  tags:
    karpenter.sh/discovery: CT-EKS-Cluster
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r"]
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: In
          values: ["4", "8", "16", "32"]
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["2"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
